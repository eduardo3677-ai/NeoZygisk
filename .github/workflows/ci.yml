name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      # Expose the generated release/debug zip names so the `release` job can
      # locate and attach them when a GitHub Release is created.
      release_name: ${{ steps.prepare_artifacts.outputs.RELEASE_NAME }}
      debug_name: ${{ steps.prepare_artifacts.outputs.DEBUG_NAME }}

    steps:
      # ====================================================================
      # 1. SETUP ENVIRONMENT
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0 # Needed for versioning from git history

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        run: |
          rustup override set nightly
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        # The zygiskd build invokes `cargo ndk` to cross-compile the daemon.
        # Intentionally unpinned: the build uses the `--platform` flag, which is
        # stable across cargo-ndk releases. See the commit message for the caveat.
        run: cargo install cargo-ndk --locked

      - name: Setup Ccache for faster builds
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zygiskd -> build/rust/target

      # ====================================================================
      # 2. CONFIGURE AND BUILD
      # ====================================================================
      - name: Build with Gradle
        run: ./gradlew zipRelease zipDebug -Porg.gradle.parallel=true -Porg.gradle.vfs.watch=true -Dorg.gradle.jvmargs=-Xmx2048m

      # ====================================================================
      # 3. PREPARE AND UPLOAD ARTIFACTS
      # ====================================================================
      - name: Prepare build artifacts
        if: success()
        id: prepare_artifacts
        run: |
          RELEASE_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-release.zip')
          DEBUG_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-debug.zip')

          RELEASE_NAME=$(basename "$RELEASE_ZIP" .zip)
          DEBUG_NAME=$(basename "$DEBUG_ZIP" .zip)

          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "DEBUG_NAME=${DEBUG_NAME}" >> $GITHUB_OUTPUT
          echo "RELEASE_ZIP=${RELEASE_ZIP}" >> $GITHUB_OUTPUT

          unzip "$RELEASE_ZIP" -d "release-artifact"
          unzip "$DEBUG_ZIP" -d "debug-artifact"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifacts.outputs.RELEASE_NAME }}
          path: release-artifact/

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifacts.outputs.DEBUG_NAME }}
          path: debug-artifact/

      - name: Upload Release Symbols
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols
          path: zygiskd/build/symbols/release/

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: zygiskd/build/symbols/debug/

      # Keep the raw, compressed release zip so the `release` job can attach it
      # to a GitHub Release (the unpacked `release-artifact/` is only for diffing).
      - name: Upload Release Zip (compressed)
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ steps.prepare_artifacts.outputs.RELEASE_ZIP }}
          if-no-files-found: error

  # ====================================================================
  # RELEASE: Builds a GitHub Release automatically on every push to
  # `master`. A unique tag is derived from the built zip name (which
  # embeds the semantic version, the commit count and the commit hash),
  # so each push produces its own immutable release. Release notes are
  # generated automatically from the commits since the previous release,
  # and the update manifest (`module/zygisk.json`) is refreshed and
  # pushed back to `master` so manager apps pick up the new version.
  #
  # The metadata push is made with the default GITHUB_TOKEN, which does
  # NOT re-trigger this `push` workflow, so there is no release loop.
  # ====================================================================
  release:
    runs-on: ubuntu-latest
    needs: build
    # Only create a release on real pushes to the default branch.
    # PRs / merge_group / workflow_dispatch still build & verify above
    # but do not publish a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: write # Allow creating Git tags/Releases AND pushing json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so we can diff commits since the last release tag.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release Zip (compressed)
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release-zip/

      - name: Determine Release Metadata
        id: version
        run: |
          # RELEASE_NAME looks like "NeoZygisk-v<verName>-<commitHash>-release"
          # with verName = "v<ver>.<commitCount>", e.g. NeoZygisk-v2.3.277-abc1234-release
          RELEASE_NAME="${{ needs.build.outputs.release_name }}"

          BASE="${RELEASE_NAME#NeoZygisk-}"   # v2.3.277-abc1234-release
          BASE="${BASE%-release}"             # v2.3.277-abc1234
          TAG="${BASE}"                       # unique per push

          VERSION="${BASE%-*}"                # v2.3.277
          VERSION_CODE="${VERSION##*.}"       # 277
          COMMIT_HASH="${BASE##*-}"           # abc1234
          ZIP_NAME="${RELEASE_NAME}.zip"

          if [ -z "$TAG" ] || [ "$BASE" = "$RELEASE_NAME" ]; then
            echo "::error::unexpected release artifact name: $RELEASE_NAME"
            exit 1
          fi

          echo "tag=${TAG}"                    >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}"  >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"            >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}"  >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}"    >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}"          >> "$GITHUB_OUTPUT"
          echo "Detected: tag=$TAG version=$VERSION code=$VERSION_CODE sha=$COMMIT_HASH"

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Find the most recent previously published release tag (if any).
          gh auth status  2>/dev/null || true
          LAST_TAG="$(gh release list --limit 2 --json tagName --jq '.[1].tagName // empty' || true)"
          if [ -n "$LAST_TAG" ]; then
            echo "Generating notes since previous release tag: $LAST_TAG"
            NOTES="$(git log "$LAST_TAG"..HEAD --no-merges --pretty=format:'- %s')"
          else
            echo "No previous release found; using recent commits"
            NOTES="$(git log -20 --no-merges --pretty=format:'- %s')"
          fi

          NOTES="${NOTES:-No changes recorded.}"
          # Store change summaries for use in the release body.
          {
            echo "notes<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ## ${{ steps.version.outputs.release_name }}

            **Auto-generated release** from commit `${{ steps.version.outputs.commit_hash }}`
            on push to `master`.

            ### Changes
            ${{ steps.changelog.outputs.notes }}

            ---
            Changelog (full): `module/changelog.md`
          files: |
            release-zip/**
          fail_on_unmatched_files: false
          draft: false
          prerelease: false

      - name: Update update manifest (zygisk.json)
        run: |
          REPO="${{ github.repository }}"   # eduardo3677-ai/NeoZygisk
          TAG="${{ steps.version.outputs.tag }}"
          ZIP_NAME="${{ steps.version.outputs.zip_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          ZIP_URL="https://github.com/${REPO}/releases/download/${TAG}/${ZIP_NAME}"
          CHANGELOG_URL="https://raw.githubusercontent.com/${REPO}/master/module/changelog.md"

          cat > module/zygisk.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "${ZIP_URL}",
            "changelog": "${CHANGELOG_URL}"
          }
          EOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module/zygisk.json
          if git diff --cached --quiet; then
            echo "zygisk.json unchanged; nothing to commit."
          else
            git commit -m "chore(module): update update manifest to ${VERSION} (${VERSION_CODE})"
            git push origin master
            echo "Pushed updated zygisk.json (${VERSION}, code ${VERSION_CODE})."
          fi
