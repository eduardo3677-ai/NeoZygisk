name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      # Expose the generated release/debug zip names so the `release` job can
      # locate and attach them when a GitHub Release is created.
      release_name: ${{ steps.prepare_artifacts.outputs.RELEASE_NAME }}
      debug_name: ${{ steps.prepare_artifacts.outputs.DEBUG_NAME }}

    steps:
      # ====================================================================
      # 1. SETUP ENVIRONMENT
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0 # Needed for versioning from git history

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        run: |
          rustup override set nightly
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        # The zygiskd build invokes `cargo ndk` to cross-compile the daemon.
        # Intentionally unpinned: the build uses the `--platform` flag, which is
        # stable across cargo-ndk releases. See the commit message for the caveat.
        run: cargo install cargo-ndk --locked

      - name: Setup Ccache for faster builds
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zygiskd -> build/rust/target

      # ====================================================================
      # 2. CONFIGURE AND BUILD
      # ====================================================================
      - name: Build with Gradle
        run: ./gradlew zipRelease zipDebug -Porg.gradle.parallel=true -Porg.gradle.vfs.watch=true -Dorg.gradle.jvmargs=-Xmx2048m

      # ====================================================================
      # 3. PREPARE AND UPLOAD ARTIFACTS
      # ====================================================================
      - name: Prepare build artifacts
        if: success()
        id: prepare_artifacts
        run: |
          RELEASE_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-release.zip')
          DEBUG_ZIP=$(find module/build/outputs/release -type f -name 'NeoZygisk-v*-debug.zip')

          RELEASE_NAME=$(basename "$RELEASE_ZIP" .zip)
          DEBUG_NAME=$(basename "$DEBUG_ZIP" .zip)

          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "DEBUG_NAME=${DEBUG_NAME}" >> $GITHUB_OUTPUT

          unzip "$RELEASE_ZIP" -d "release-artifact"
          unzip "$DEBUG_ZIP" -d "debug-artifact"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifacts.outputs.RELEASE_NAME }}
          path: release-artifact/

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifacts.outputs.DEBUG_NAME }}
          path: debug-artifact/

      - name: Upload Release Symbols
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols
          path: zygiskd/build/symbols/release/

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: zygiskd/build/symbols/debug/

  # ====================================================================
  # RELEASE: Builds a GitHub Release automatically on every push to
  # `master`. A unique tag is derived from the built zip name (which
  # embeds verName, verCode and the commit hash), so each push produces
  # its own immutable release.
  # ====================================================================
  release:
    runs-on: ubuntu-latest
    needs: build
    # Only create a release on real pushes to the default branch.
    # PRs / merge_group / workflow_dispatch still build & verify above
    # but do not publish a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: write # Allow creating Git tags and GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.release_name }}
          path: release-artifact/

      - name: Determine Release Tag & Version
        id: version
        run: |
          # RELEASE_NAME looks like "NeoZygisk-v<verName>-<verCode>-<commitHash>"
          RELEASE_NAME="${{ needs.build.outputs.release_name }}"
          # Derive a unique, immutable tag: strip the "NeoZygisk-" prefix.
          TAG="${RELEASE_NAME#NeoZygisk-}"
          if [ -z "$TAG" ] || [ "$TAG" = "$RELEASE_NAME" ]; then
            echo "::error::unexpected release artifact name: $RELEASE_NAME"
            exit 1
          fi
          echo "tag=${TAG}"          >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            Auto-generated release from commit `${{ github.sha }}`.

            This release was built automatically on push to `master`.
            See the changelog (`module/changelog.md`) for details.
          files: |
            release-artifact/**
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
